# Configuration Netlify — MOSAIQ (https://mosaiq.company)

[build]
  command = "npm run build"
  # Next.js en export statique génère le site dans /out
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# En-têtes de sécurité appliqués à toutes les pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Fichiers Next.js versionnés (nom unique à chaque build) : cache d'un an
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
